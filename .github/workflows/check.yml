name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Format
        run: nix fmt -- --ci
      - name: Clippy (WASM)
        run: nix develop --command cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - name: Production build
        run: nix develop --command trunk build --release --locked --public-url "/portfolio/"
