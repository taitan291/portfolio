[package]
name = "githubio"
version = "0.1.0"
edition = "2021"
authors = ["taitan291"]
license = "GPL-3.0-or-later"

[dependencies]
# leptos(WASM)
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"

web-sys = { version = "0.3", features = [
  "HtmlDialogElement",
  "HtmlElement",
  "Element",
  "CssStyleDeclaration",
  "DomRect",
  "KeyboardEvent",
  "Storage",
  # 404 射的ゲーム (components/game)
  "Window",
  "Document",
  "Event",
  "EventTarget",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "PointerEvent",
  "MouseEvent",
  "Performance",
  "VisibilityState",
  "MediaQueryList",
  "ResizeObserver",
  "AudioContext",
  "AudioContextState",
  "BaseAudioContext",
  "AudioNode",
  "AudioParam",
  "AudioDestinationNode",
  "AudioScheduledSourceNode",
  "OscillatorNode",
  "OscillatorType",
  "GainNode",
  "AudioBuffer",
  "AudioBufferSourceNode",
  "BiquadFilterNode",
  "BiquadFilterType",
] }
wasm-bindgen = "0.2"
js-sys = "0.3"

# WASM でのみ使う（ネイティブの `cargo test` では不要）。
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"

[build-dependencies]
pulldown-cmark = "0.12"

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"
