[package]
name = "githubio"
version = "0.1.0"
edition = "2021"
authors = ["taitan291"]
license = "GPL-3.0-or-later"

[dependencies]
console_error_panic_hook = "0.1.7"

# leptos(WASM)
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"

web-sys = { version = "0.3", features = ["HtmlDialogElement", "DomRect"] }

[build-dependencies]
pulldown-cmark = "0.12"

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"
