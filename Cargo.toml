[package]
name = "githubio"
version = "0.1.0"
edition = "2021"
authors = ["taitan291"]
license = "GPL-3.0-or-later"

[dependencies]
console_error_panic_hook = "0.1.7"

# leptos(WASM)
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"

js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "DomRect",
  "DomTokenList",
  "Element",
  "HtmlDialogElement",
  "IntersectionObserver",
  "IntersectionObserverEntry",
  "IntersectionObserverInit",
  "NodeList",
] }

[build-dependencies]
pulldown-cmark = "0.12"

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"
